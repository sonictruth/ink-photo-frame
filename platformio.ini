; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
lib_deps =
	zinggjm/GxEPD2@^1.5.6
	adafruit/Adafruit GFX Library@^1.11.9
	bitbank2/JPEGDEC@^1.8.2

; Filesystem (images) only: firmware OTA is refused by the device itself, since
; partitions.csv has a single "ota_0" app slot (no room for an A/B update).
; Usage: pio run -e esp32dev_ota -t uploadfs --upload-port <device-ip>
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
	--auth=${sysenv.OTA_PASSWORD}
